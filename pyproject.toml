[project]
name = "m2tw"
version = "1.0.1"
description = "Magicka 2 台灣繁體中文化補丁（以遊俠 ALI213 簡體中文漢化為基礎）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=11.0",
]

[project.optional-dependencies]
# 翻譯編輯器（PySide6 視窗）；安裝程式本身不需要
editor = ["pyside6>=6.8"]

[dependency-groups]
dev = ["pyinstaller>=6.11"]

[project.scripts]
m2tw-installer = "m2tw.gui:main"
m2tw-convert = "m2tw.translate:main_cli"
m2tw-editor = "m2tw.translate:main_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m2tw"]
